plugins { id 'com.android.application'; id 'com.chaquo.python' }

android { namespace 'com.example.offlinemusicplayer'; compileSdk 35
    defaultConfig { applicationId 'com.example.offlinemusicplayer'; minSdk 26; targetSdk 35; versionCode 2; versionName '2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Phone release stays small; emulatorTest adds x86_64 only for CI runtime tests.
        ndk { abiFilters 'arm64-v8a'; if (project.hasProperty('emulatorTest')) abiFilters 'arm64-v8a', 'x86_64' }
    }
}

dependencies {
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

chaquopy { defaultConfig { version = '3.11'; pip { install 'yt-dlp' } } }
